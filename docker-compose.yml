services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-restaurant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_restaurant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    restart: unless-stopped

  api:
    build: .
    container_name: smart-restaurant-api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/smart_restaurant?sslmode=disable
      JWT_SECRET: super-secret-smart-restaurant-egypt-2026
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,*
      ENVIRONMENT: production
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
