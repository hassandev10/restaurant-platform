syntax = "proto3";

package restaurant.v1;

option go_package = "smart-restaurant-api/gen/restaurant/v1;restaurantv1";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_CONFIRMED = 2;
  ORDER_STATUS_PREPARING = 3;
  ORDER_STATUS_READY = 4;
  ORDER_STATUS_SERVED = 5;
  ORDER_STATUS_CANCELLED = 6;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_DINE_IN = 1;
  ORDER_TYPE_TAKEAWAY = 2;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PAID = 2;
  PAYMENT_STATUS_REFUNDED = 3;
}

message SelectedOptionSnapshot {
  string group_id = 1;
  string group_name_ar = 2;
  string option_id = 3;
  string option_name_ar = 4;
  double price_delta = 5;
}

message OrderItem {
  string id = 1;
  string product_id = 2;
  string product_name_snapshot = 3;
  double unit_price_snapshot = 4;
  int32 quantity = 5;
  repeated SelectedOptionSnapshot selected_options = 6;
  string notes = 7;
  double line_total = 8;
}

message OrderEvent {
  string id = 1;
  string timestamp = 2;
  OrderStatus status = 3;
  string actor = 4;
  string note = 5;
}

message Order {
  string id = 1;
  string order_number = 2;
  OrderType order_type = 3;
  string restaurant_id = 4;
  string branch_id = 5;
  string table_id = 6;
  string table_name = 7;
  string table_name_snapshot = 8;
  optional string session_id = 9;
  OrderStatus status = 10;
  repeated OrderItem items = 11;
  double subtotal = 12;
  double discount = 13;
  double tax = 14;
  double fee = 15;
  double total = 16;
  PaymentStatus payment_status = 17;
  string created_at = 18;
  string updated_at = 19;
  repeated OrderEvent events = 20;
  optional string cancellation_reason = 21;
  optional string cancelled_at = 22;
  optional string cancelled_by = 23;
  string latest_actor = 24;
}

message CreateOrderItemOptionRequest {
  string group_id = 1;
  string option_id = 2;
}

message CreateOrderItemRequest {
  string product_id = 1;
  int32 quantity = 2;
  repeated CreateOrderItemOptionRequest selected_options = 3;
  string notes = 4;
}

message CreateOrderRequest {
  OrderType order_type = 1;
  string table_context_token = 2;
  string table_token = 3;
  string restaurant_id = 4;
  string branch_id = 5;
  string table_id = 6;
  string table_name_snapshot = 7;
  string table_name = 8;
  repeated CreateOrderItemRequest items = 9;
  string notes = 10;
  bool force_new_order = 11;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message GetOrderEventsRequest {
  string order_id = 1;
}

message GetOrderEventsResponse {
  repeated OrderEvent events = 1;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  OrderStatus status = 2;
  string actor = 3;
  string note = 4;
  bool allow_low_stock_override = 5;
  string override_reason = 6;
}

message UpdateOrderStatusResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
  string actor = 3;
}

message CancelOrderResponse {
  Order order = 1;
}

message ListActiveOrdersRequest {
  string restaurant_slug = 1;
}

message ListActiveOrdersResponse {
  repeated Order orders = 1;
}

message ListHistoricalOrdersRequest {
  string restaurant_slug = 1;
  string date = 2;
}

message ListHistoricalOrdersResponse {
  repeated Order orders = 1;
}

message SimulateIncomingOrderRequest {
  string restaurant_id = 1;
  string branch_id = 2;
}

message SimulateIncomingOrderResponse {
  Order order = 1;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc GetOrderEvents(GetOrderEventsRequest) returns (GetOrderEventsResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc ListActiveOrders(ListActiveOrdersRequest) returns (ListActiveOrdersResponse);
  rpc ListHistoricalOrders(ListHistoricalOrdersRequest) returns (ListHistoricalOrdersResponse);
  rpc SimulateIncomingOrder(SimulateIncomingOrderRequest) returns (SimulateIncomingOrderResponse);
}
