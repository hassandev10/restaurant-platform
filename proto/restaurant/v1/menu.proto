syntax = "proto3";

package restaurant.v1;

option go_package = "smart-restaurant-api/gen/restaurant/v1;restaurantv1";

import "restaurant/v1/restaurant.proto";

message MenuCategory {
  string id = 1;
  string restaurant_id = 2;
  string name_ar = 3;
  string name_en = 4;
  int32 display_order = 5;
  bool is_active = 6;
  string icon_name = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ProductOption {
  string id = 1;
  string option_group_id = 2;
  string name_ar = 3;
  string name_en = 4;
  double price_modifier = 5;
  bool is_default = 6;
  int32 display_order = 7;
  bool is_available = 8;
}

message ProductOptionGroup {
  string id = 1;
  string product_id = 2;
  string name_ar = 3;
  string name_en = 4;
  int32 min_selection = 5;
  int32 max_selection = 6;
  bool is_required = 7;
  int32 display_order = 8;
  repeated ProductOption options = 9;
}

message Product {
  string id = 1;
  string restaurant_id = 2;
  string category_id = 3;
  string name_ar = 4;
  string name_en = 5;
  string description = 6;
  double price = 7;
  optional double discount_price = 8;
  string image_url = 9;
  bool is_available = 10;
  bool is_featured = 11;
  string badge = 12;
  int32 display_order = 13;
  repeated ProductOptionGroup options = 14;
  string created_at = 15;
  string updated_at = 16;
}

message GetMenuRequest {
  string restaurant_slug = 1;
}

message GetMenuResponse {
  Restaurant restaurant = 1;
  repeated MenuCategory categories = 2;
  repeated Product products = 3;
}

message ListCategoriesRequest {
  string restaurant_slug = 1;
}

message ListCategoriesResponse {
  repeated MenuCategory categories = 1;
}

message GetCategoryRequest {
  string category_id = 1;
}

message GetCategoryResponse {
  MenuCategory category = 1;
}

message CreateCategoryRequest {
  string name_ar = 1;
  string name_en = 2;
  int32 display_order = 3;
  bool is_active = 4;
  string icon_name = 5;
}

message CreateCategoryResponse {
  MenuCategory category = 1;
}

message UpdateCategoryRequest {
  string id = 1;
  optional string name_ar = 2;
  optional string name_en = 3;
  optional int32 display_order = 4;
  optional bool is_active = 5;
  optional string icon_name = 6;
}

message UpdateCategoryResponse {
  MenuCategory category = 1;
}

message DeleteCategoryRequest {
  string id = 1;
}

message DeleteCategoryResponse {
  bool success = 1;
}

message ReorderCategoryItem {
  string id = 1;
  int32 display_order = 2;
}

message ReorderCategoriesRequest {
  repeated ReorderCategoryItem items = 1;
}

message ReorderCategoriesResponse {
  bool success = 1;
}

message ListProductsRequest {
  string restaurant_slug = 1;
  string category_id = 2;
  string query = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message CreateOptionRequest {
  string name_ar = 1;
  string name_en = 2;
  double price_modifier = 3;
  bool is_default = 4;
  int32 display_order = 5;
  bool is_available = 6;
}

message CreateOptionGroupRequest {
  string name_ar = 1;
  string name_en = 2;
  int32 min_selection = 3;
  int32 max_selection = 4;
  bool is_required = 5;
  int32 display_order = 6;
  repeated CreateOptionRequest options = 7;
}

message CreateProductRequest {
  string category_id = 1;
  string name_ar = 2;
  string name_en = 3;
  string description = 4;
  double price = 5;
  optional double discount_price = 6;
  string image_url = 7;
  bool is_available = 8;
  bool is_featured = 9;
  string badge = 10;
  int32 display_order = 11;
  repeated CreateOptionGroupRequest options = 12;
}

message CreateProductResponse {
  Product product = 1;
}

message UpdateProductRequest {
  string id = 1;
  optional string category_id = 2;
  optional string name_ar = 3;
  optional string name_en = 4;
  optional string description = 5;
  optional double price = 6;
  optional double discount_price = 7;
  optional string image_url = 8;
  optional bool is_available = 9;
  optional bool is_featured = 10;
  optional string badge = 11;
  optional int32 display_order = 12;
  repeated CreateOptionGroupRequest options = 13;
}

message UpdateProductResponse {
  Product product = 1;
}

message DeleteProductRequest {
  string id = 1;
}

message DeleteProductResponse {
  bool success = 1;
}

message ToggleProductAvailabilityRequest {
  string product_id = 1;
  bool is_available = 2;
}

message ToggleProductAvailabilityResponse {
  string product_id = 1;
  bool is_available = 2;
  string message = 3;
  bool success = 4;
}

service MenuService {
  rpc GetMenu(GetMenuRequest) returns (GetMenuResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc ReorderCategories(ReorderCategoriesRequest) returns (ReorderCategoriesResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc ToggleProductAvailability(ToggleProductAvailabilityRequest) returns (ToggleProductAvailabilityResponse);
}
